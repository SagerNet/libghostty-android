name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache libghostty-vt objects
        uses: actions/cache@v6
        with:
          path: build/ghostty/zig-cache
          key: ghostty-vt-${{ env.ZIG_VERSION }}-${{ hashFiles('GHOSTTY_REF', 'patches/ghostty/*.patch') }}
          restore-keys: ghostty-vt-${{ env.ZIG_VERSION }}-
      - name: Install NDK
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' library/build.gradle.kts)
          echo "NDK_VERSION=$ndk" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew :library:assembleRelease
      - name: Check patch assumptions
        run: scripts/check-patch-assumptions.sh build/ghostty/source
      - name: Check 16 KB page alignment
        run: |
          readelf="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unzip -q -o library/build/outputs/aar/library-release.aar -d /tmp/aar 'jni/*'
          for so in /tmp/aar/jni/*/libghostty_android.so; do
            "$readelf" -l "$so" | python3 -c '
          import re, sys
          aligns = [int(m, 16) for m in re.findall(r"LOAD.* (0x[0-9a-f]+)\s*$", sys.stdin.read(), re.M)]
          assert aligns and min(aligns) >= 16384, aligns'
            echo "$so OK"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: library-release
          path: library/build/outputs/aar/library-release.aar

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache libghostty-vt objects
        uses: actions/cache@v6
        with:
          path: build/ghostty/zig-cache
          key: ghostty-vt-${{ env.ZIG_VERSION }}-${{ hashFiles('GHOSTTY_REF', 'patches/ghostty/*.patch') }}
          restore-keys: ghostty-vt-${{ env.ZIG_VERSION }}-
      - name: Install NDK
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' library/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis_ps16k-x86_64
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -camera-back none
          disable-animations: false
          script: echo "snapshot written"
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          disable-animations: true
          script: ./gradlew :library:connectedDebugAndroidTest

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches VERSION_NAME
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION_NAME=$version" >&2
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache libghostty-vt objects
        uses: actions/cache@v6
        with:
          path: build/ghostty/zig-cache
          key: ghostty-vt-${{ env.ZIG_VERSION }}-${{ hashFiles('GHOSTTY_REF', 'patches/ghostty/*.patch') }}
          restore-keys: ghostty-vt-${{ env.ZIG_VERSION }}-
      - name: Install NDK
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' library/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Create GitHub release
        run: |
          ./gradlew :library:assembleRelease
          gh release create "$GITHUB_REF_NAME" library/build/outputs/aar/library-release.aar \
            --title "$GITHUB_REF_NAME" \
            --notes "ghostty commit: $(cat GHOSTTY_REF)"
        env:
          GH_TOKEN: ${{ github.token }}
