name: Update ghostty

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ghostty_ref:
        description: "ghostty tag or commit to pin (default: latest release tag)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

env:
  ZIG_VERSION: 0.17.0

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.upstream.outputs.head }}
      name: ${{ steps.upstream.outputs.name }}
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve upstream commit
        id: upstream
        env:
          GHOSTTY_REF_INPUT: ${{ inputs.ghostty_ref }}
        run: |
          upstream=https://github.com/ghostty-org/ghostty.git
          ref="$GHOSTTY_REF_INPUT"
          if [ -z "$ref" ]; then
            ref=$(git ls-remote --tags --sort=-version:refname "$upstream" 'refs/tags/v*' \
              | awk '$2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2; exit }')
          fi
          head=$(git ls-remote "$upstream" "refs/tags/$ref" "refs/tags/$ref^{}" | sort -k2 -r | head -1 | cut -f1)
          if [ -n "$head" ]; then
            name="$ref"
          else
            head="$ref"
            name="${ref:0:9}"
          fi
          current=$(git ls-files -s ghostty | awk '{print $2}')
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Bump the ghostty submodule
        env:
          HEAD_COMMIT: ${{ needs.resolve.outputs.head }}
        run: |
          git -C ghostty fetch --depth 1 origin "$HEAD_COMMIT"
          git -C ghostty checkout -qf "$HEAD_COMMIT"
          git add ghostty
      - uses: ./.github/actions/setup
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build with new commit
        run: ./gradlew :library:assembleRelease
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT: ${{ needs.resolve.outputs.head }}
          NAME: ${{ needs.resolve.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c update-ghostty
          git commit -m "Update ghostty to $NAME" ghostty
          git push -f origin update-ghostty
          title="Update ghostty to $NAME"
          body="https://github.com/ghostty-org/ghostty/commit/$HEAD_COMMIT"
          if gh pr view update-ghostty --json number >/dev/null 2>&1; then
            gh pr edit update-ghostty --title "$title" --body "$body"
          else
            gh pr create --base main --head update-ghostty --title "$title" --body "$body"
          fi
