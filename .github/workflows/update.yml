name: Update ghostty

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ghostty_ref:
        description: "ghostty commit to pin (default: upstream main HEAD)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.upstream.outputs.head }}
      short: ${{ steps.upstream.outputs.short }}
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve upstream commit
        id: upstream
        env:
          GHOSTTY_REF_INPUT: ${{ inputs.ghostty_ref }}
        run: |
          if [ -n "$GHOSTTY_REF_INPUT" ]; then
            head="$GHOSTTY_REF_INPUT"
          else
            head=$(git ls-remote https://github.com/ghostty-org/ghostty.git refs/heads/main | cut -f1)
          fi
          current=$(cat GHOSTTY_REF)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "short=${head:0:9}" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bump GHOSTTY_REF
        run: printf '%s\n' "${{ needs.resolve.outputs.head }}" > GHOSTTY_REF
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache libghostty-vt objects
        uses: actions/cache@v6
        with:
          path: build/ghostty/zig-cache
          key: ghostty-vt-${{ env.ZIG_VERSION }}-${{ hashFiles('GHOSTTY_REF', 'patches/ghostty/*.patch') }}
          restore-keys: ghostty-vt-${{ env.ZIG_VERSION }}-
      - name: Install NDK
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' library/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - name: Build with new commit
        run: ./gradlew :library:assembleRelease
      - name: Check patch assumptions
        run: scripts/check-patch-assumptions.sh build/ghostty/source
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-ghostty
          commit-message: "Update ghostty to ${{ needs.resolve.outputs.short }}"
          title: "Update ghostty to ${{ needs.resolve.outputs.short }}"
          body: https://github.com/ghostty-org/ghostty/commit/${{ needs.resolve.outputs.head }}
          add-paths: GHOSTTY_REF
