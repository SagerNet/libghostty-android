name: Update ghostty

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ghostty_ref:
        description: "ghostty commit to pin (default: upstream main HEAD)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

env:
  ZIG_VERSION: 0.16.0

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.upstream.outputs.head }}
      short: ${{ steps.upstream.outputs.short }}
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve upstream commit
        id: upstream
        env:
          GHOSTTY_REF_INPUT: ${{ inputs.ghostty_ref }}
        run: |
          if [ -n "$GHOSTTY_REF_INPUT" ]; then
            head="$GHOSTTY_REF_INPUT"
          else
            head=$(git ls-remote https://github.com/ghostty-org/ghostty.git refs/heads/main | cut -f1)
          fi
          current=$(git ls-files -s ghostty | awk '{print $2}')
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "short=${head:0:9}" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Bump the ghostty submodule
        env:
          HEAD_COMMIT: ${{ needs.resolve.outputs.head }}
        run: |
          git -C ghostty fetch --depth 1 origin "$HEAD_COMMIT"
          git -C ghostty checkout -qf "$HEAD_COMMIT"
          git add ghostty
      - uses: ./.github/actions/setup
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build with new commit
        run: ./gradlew :library:assembleRelease
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT: ${{ needs.resolve.outputs.head }}
          SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c update-ghostty
          git commit -m "Update ghostty to $SHORT" ghostty
          git push -f origin update-ghostty
          title="Update ghostty to $SHORT"
          body="https://github.com/ghostty-org/ghostty/commit/$HEAD_COMMIT"
          if gh pr view update-ghostty --json number >/dev/null 2>&1; then
            gh pr edit update-ghostty --title "$title" --body "$body"
          else
            gh pr create --base main --head update-ghostty --title "$title" --body "$body"
          fi
